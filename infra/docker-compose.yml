services:
  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    init: true
    restart: unless-stopped
    env_file: ../.env
    environment:
      SITE_OUTPUT_DIR: /site/current
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    volumes:
      - site-data:/site
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 150s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  public-site:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - site-data:/usr/share/nginx/html:ro
      - ./docker/public-site.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt: [no-new-privileges:true]
volumes:
  site-data:
