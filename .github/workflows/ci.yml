name: Manager CI & Android APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Monorepo Dependencies
        run: yarn install

      - name: Build Web Frontend
        run: |
          cd apps/web
          yarn build

      - name: Install & Setup Capacitor Android
        run: |
          cd apps/web
          yarn add @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Banglar Voice 24" "com.banglarvoice24.manager" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
